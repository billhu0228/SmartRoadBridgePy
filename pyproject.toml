[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "srbpy"
version = "0.3.2"
description = "A Python/C++ mixed road bridge design package"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bill Hu", email = "billhu0228@icloud.com" },
]
keywords = ["civil", "road", "bridge", "alignment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scikit-spatial>=4.0.0",
    "PyAngle>=2.2.0",
    "SQLAlchemy>=1.3",
    "ezdxf>=0.17",
    "packaging>=20",
    "requests>=2.27",
]

[project.urls]
Documentation = "https://smartroadbridgepy.readthedocs.io/"
Source = "https://github.com/billhu0228/SmartRoadBridgePy"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.16"
ninja.version = ">=1.11"
wheel.packages = ["src/srbpy"]
wheel.exclude = ["**/*.cpp", "**/*.h", "**/CMakeLists.txt"]
sdist.include = [
    "CMakeLists.txt",
    "lib/pybind11/**",
    "src/srbpy/**",
    "tests/**",
]
sdist.exclude = [
    "lib/pybind11/.github/**",
    "lib/pybind11/docs/**",
    "lib/pybind11/tests/**",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
build-frontend = "build"
test-requires = ["pytest"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["native"]

[tool.pytest.ini_options]
testpaths = ["tests"]
