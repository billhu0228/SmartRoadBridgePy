name: Release to PyPI

# 推送形如 v0.3.0 的标签即触发构建并发布
on:
  push:
    tags:
      - "v*"

jobs:
  # 1) 校验标签号与 pyproject.toml 中的版本一致，避免发错版本
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag=$TAG  pyproject.toml=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 pyproject.toml 版本 $VER 不一致"
            exit 1
          fi

  # 2) 在 Windows 和 Apple Silicon macOS 上构建并测试轮子
  build-wheels:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.0.0   # 如需更新版本，改这里
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # 3) 构建源码分发包（sdist）
  build-sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # 4) 发布到 PyPI（使用 Trusted Publishing / OIDC，无需 API Token）
  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/srbpy/
    permissions:
      id-token: write          # Trusted Publishing 必需
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
